name: Generate Release Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password para a keystore e chave (guarde num sítio seguro!)'
        required: true
      key_alias:
        description: 'Alias da chave'
        required: true
        default: 'standupportugal'
      owner_name:
        description: 'O seu nome (para o certificado)'
        required: true
        default: 'Antonio Silva'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Release Keystore and Base64
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KS_ALIAS: ${{ inputs.key_alias }}
          OWNER: ${{ inputs.owner_name }}
        run: |
          mkdir -p keystore-output
          keytool -genkeypair -v \
            -keystore keystore-output/standup-release.jks \
            -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=$OWNER, OU=Mobile, O=StandUpPortugal, L=Lisboa, ST=Lisboa, C=PT"
          base64 -w 0 keystore-output/standup-release.jks > keystore-output/RELEASE_KEYSTORE_BASE64.txt

      - name: Upload Keystore Artifact (Download & Save to Google Drive)
        uses: actions/upload-artifact@v4
        with:
          name: standup-release-keystore
          path: keystore-output/
          retention-days: 3
